<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 180" width="760" height="180">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a78bfa"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="760" height="180" fill="url(#bgGrad)" rx="8"/>
  <rect x="0" y="0" width="760" height="2" fill="url(#accent)" opacity="0.7"/>
  <rect x="0" y="178" width="760" height="2" fill="url(#accent)" opacity="0.4"/>

  <!-- Subtle grid -->
  <g opacity="0.04" stroke="#a78bfa" stroke-width="0.5">
    <line x1="0" y1="36" x2="760" y2="36"/>
    <line x1="0" y1="72" x2="760" y2="72"/>
    <line x1="0" y1="108" x2="760" y2="108"/>
    <line x1="0" y1="144" x2="760" y2="144"/>
  </g>

  <!-- Spider web / radar icon -->
  <g transform="translate(88, 72)" filter="url(#glow)">
    <!-- Radial lines -->
    <line x1="0" y1="-36" x2="0" y2="36" stroke="#a78bfa" stroke-width="1"/>
    <line x1="-31" y1="-18" x2="31" y2="18" stroke="#a78bfa" stroke-width="1"/>
    <line x1="-31" y1="18" x2="31" y2="-18" stroke="#a78bfa" stroke-width="1"/>
    <line x1="-36" y1="0" x2="36" y2="0" stroke="#a78bfa" stroke-width="1"/>
    <!-- Concentric rings -->
    <circle cx="0" cy="0" r="12" fill="none" stroke="#a78bfa" stroke-width="0.7" opacity="0.5"/>
    <circle cx="0" cy="0" r="24" fill="none" stroke="#a78bfa" stroke-width="0.7" opacity="0.4"/>
    <circle cx="0" cy="0" r="36" fill="none" stroke="#a78bfa" stroke-width="0.7" opacity="0.3"/>
    <!-- Center dot -->
    <circle cx="0" cy="0" r="4" fill="#a78bfa" filter="url(#softGlow)" opacity="0.8"/>
    <!-- Score indicator dots on outer ring -->
    <circle cx="0" cy="-36" r="2.5" fill="#10b981" opacity="0.7"/>
    <circle cx="31" cy="-18" r="2.5" fill="#facc15" opacity="0.7"/>
    <circle cx="31" cy="18" r="2.5" fill="#10b981" opacity="0.7"/>
    <circle cx="-31" cy="18" r="2.5" fill="#ef4444" opacity="0.5"/>
  </g>

  <!-- Accent divider -->
  <line x1="148" y1="20" x2="148" y2="160" stroke="#a78bfa" stroke-width="1" opacity="0.15"/>

  <!-- Faded signal readout -->
  <g font-family="'Courier New', Courier, monospace" font-size="9" fill="#a78bfa" opacity="0.08">
    <text x="580" y="28">SCORE: 87/100 A</text>
    <text x="580" y="42">RSI(14): 62.4</text>
    <text x="580" y="56">VWAP: +0.32%</text>
    <text x="580" y="70">VOL: 1.8x AVG</text>
    <text x="580" y="84">DTE: 0 REC</text>
    <text x="580" y="98">ECON: CLEAR</text>
    <text x="580" y="112">HOLD: 8-12 min</text>
    <text x="580" y="126">PRED: 72% ACC</text>
    <text x="580" y="140">CHAIN: $1.42</text>
    <text x="580" y="154">SIGNAL: LONG</text>
  </g>

  <!-- Title -->
  <text x="164" y="50" font-family="'Courier New', Courier, monospace" font-size="28" font-weight="bold" fill="#a78bfa" filter="url(#glow)">SPYderScalp</text>

  <!-- Subtitle -->
  <text x="166" y="74" font-family="'Courier New', Courier, monospace" font-size="13" fill="#8b949e">Real-Time SPY Options Signal Monitor</text>

  <!-- Description -->
  <text x="166" y="98" font-family="'Courier New', Courier, monospace" font-size="11" fill="#484f58">12-indicator scoring  ·  0-2 DTE  ·  Options scanner  ·  Econ calendar</text>

  <!-- Badges -->
  <g font-family="'Courier New', Courier, monospace" font-size="9.5" font-weight="700">
    <rect x="166" y="110" width="52" height="16" rx="3" fill="#1f2937" stroke="#374151" stroke-width="1"/>
    <text x="192" y="122" fill="#a78bfa" text-anchor="middle">python</text>
    <rect x="224" y="110" width="42" height="16" rx="3" fill="#1f2937" stroke="#374151" stroke-width="1"/>
    <text x="245" y="122" fill="#6b7280" text-anchor="middle">PyQt</text>
    <rect x="272" y="110" width="56" height="16" rx="3" fill="#1f2937" stroke="#374151" stroke-width="1"/>
    <text x="300" y="122" fill="#6b7280" text-anchor="middle">scoring</text>
    <rect x="334" y="110" width="48" height="16" rx="3" fill="#1f2937" stroke="#374151" stroke-width="1"/>
    <text x="358" y="122" fill="#6b7280" text-anchor="middle">0-2DTE</text>
    <rect x="388" y="110" width="48" height="16" rx="3" fill="#1f2937" stroke="#374151" stroke-width="1"/>
    <text x="412" y="122" fill="#6b7280" text-anchor="middle">alerts</text>
  </g>

  <!-- Author -->
  <text x="166" y="160" font-family="'Courier New', Courier, monospace" font-size="11" fill="#484f58">SkyzFallin</text>
</svg>
